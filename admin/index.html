<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawtery — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #FFFDF9; font-family: sans-serif; }
    .loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; gap: 16px;
      color: #8A6A58;
    }
    .loading-logo {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem; color: #B85C38;
    }
    .loading-sub { font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div style="width:52px;height:52px;background:#B85C38;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🐾</div>
    <div class="loading-logo">Pawtery</div>
    <div class="loading-sub">Loading admin panel…</div>
  </div>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
</body>
</html>
