backend:
  name: git-gateway
  branch: main

site_url: https://pawtery.shop
display_url: https://pawtery.shop

# Keep the editing screen simple: the public website is the preview.
editor:
  preview: false

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    description: "Click a product to edit it, or choose New Product to add one. After you save, the website updates automatically in about a minute."
    folder: "products"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    summary: "{{name}} — {{price}}"
    sortable_fields: ["order", "name", "commit_date"]
    fields:
      - label: "Product Name"
        name: "name"
        widget: "string"
        hint: "The name customers will see on the website."

      - label: "Price Shown on Website"
        name: "price"
        widget: "string"
        hint: "Examples: From $25, $35, or Price Varies."

      - label: "Small Price Note"
        name: "price_note"
        widget: "string"
        required: false
        hint: "Optional. Example: · price varies by size"

      - label: "Product Badge"
        name: "badge"
        widget: "select"
        required: false
        hint: "Optional label shown on the product photo."
        options:
          - { label: "⭐ Bestseller", value: "⭐ Bestseller" }
          - { label: "☕ Popular", value: "☕ Popular" }
          - { label: "🎁 Gift Favorite", value: "🎁 Gift Favorite" }
          - { label: "🐱 For Cats", value: "🐱 For Cats" }
          - { label: "🐕 Big Dogs", value: "🐕 Big Dogs" }
          - { label: "☕ Mug Shot", value: "☕ Mug Shot" }
          - { label: "🐈 Cat Person", value: "🐈 Cat Person" }
          - { label: "✏️ Custom", value: "✏️ Custom" }
          - { label: "🎁 Gift Idea", value: "🎁 Gift Idea" }

      - label: "Product Photo"
        name: "photo"
        widget: "image"
        hint: "Upload or choose the main product photo. Square photos work best."

      - label: "Short Description"
        name: "snippet"
        widget: "string"
        hint: "One short sentence shown on the product card."

      - label: "Full Product Story"
        name: "story"
        widget: "text"
        hint: "This appears after a customer clicks the product. Two or three sentences works well."

      - label: "Product Details"
        name: "details"
        widget: "list"
        label_singular: "Detail"
        collapsed: false
        field:
          label: "Detail"
          name: "text"
          widget: "string"
          hint: "Examples: size, colors, food-safe information, shipping, or turnaround time."

      - label: "Show This Product on the Website?"
        name: "visible"
        widget: "boolean"
        default: true
        hint: "ON = customers can see it. OFF = keep it saved here but hide it from the public website."

      - label: "Website Order"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        default: 99
        hint: "Lower numbers appear first. You can usually leave this alone. Use 10, 20, 30, etc. if you want to rearrange products."

  - name: "events"
    label: "Events & Markets"
    label_singular: "Event"
    description: "Add upcoming markets, fairs, and appearances here. Past dates automatically disappear from the public website."
    folder: "events"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('MMM D, YYYY')}} — {{name}}"
    sortable_fields: ["date", "name", "commit_date"]
    fields:
      - label: "Event Name"
        name: "name"
        widget: "string"
        hint: "Example: Winter Park Art Festival"

      - label: "Event Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - label: "Location"
        name: "location"
        widget: "string"
        hint: "Venue, city, or market location."

      - label: "Time / Booth / Extra Details"
        name: "notes"
        widget: "string"
        required: false
        hint: "Optional. Example: 9 AM–2 PM · Booth #14"

      - label: "Show This Event on the Website?"
        name: "visible"
        widget: "boolean"
        default: true
        hint: "Turn this off if you want to save the event without showing it publicly yet."

  - name: "settings"
    label: "Website Settings"
    description: "Update Pawtery's contact information, announcement bar, turnaround time, and About Us text."
    files:
      - label: "Edit Website Information"
        name: "website"
        file: "data/settings.json"
        editor:
          preview: false
        fields:
          - label: "Contact Email"
            name: "email"
            widget: "string"
            hint: "Email address customers see on the website. If this changes, ask the site administrator to update the contact-form notification address too."

          - label: "Facebook Page"
            name: "facebook"
            widget: "string"
            hint: "Paste the full Facebook page address."

          - label: "Announcement Bar"
            name: "announcement"
            widget: "string"
            hint: "The short message across the very top of the homepage. Keep the words “Order yours today” if you want that phrase to remain clickable."

          - label: "Custom Order Turnaround"
            name: "turnaround"
            widget: "string"
            hint: "Example: approximately 6 weeks"

          - label: "About Us — First Paragraph"
            name: "about1"
            widget: "text"

          - label: "About Us — Second Paragraph"
            name: "about2"
            widget: "text"
